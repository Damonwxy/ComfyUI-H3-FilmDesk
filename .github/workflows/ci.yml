name: FilmDesk CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python and FFmpeg (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - name: Install studio, timeline and MCP dependencies
        run: python -m pip install -r requirements-studio.txt -r requirements-timeline.txt -r requirements-mcp.txt
      - name: Verify media and MCP prerequisites
        run: |
          ffmpeg -version
          ffprobe -version
          python -c "import opentimelineio, studio_mcp"
      - name: Run Python integration tests
        run: python -m unittest discover -v -s tests -p "test_*.py"

  studio:
    name: Studio JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
